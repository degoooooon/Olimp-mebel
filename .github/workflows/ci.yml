name: Проверки

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Раньше этот файл публиковал статику на GitHub Pages. Публикация убрана:
# рабочий сайт стоит на своём хостинге, а вторая копия каталога в интернете
# никому не нужна — она молча устаревает и показывает старые цены.
# Осталась проверка: линтер и обе сборки на каждый пуш.

# Ничего, кроме чтения кода, проверкам не требуется.
permissions:
  contents: read

# Новый пуш в ветку отменяет проверку предыдущего — нет смысла ждать
# результат по коду, который уже переписан.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Версия LTS, а не последняя: на ней проект и должен собираться у любого,
      # кто возьмёт репозиторий. Node 20 здесь стоять больше не может —
      # поддержка кончилась в апреле 2026, обновления безопасности не выходят.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build

      # Тема — это то, что реально стоит на хостинге, поэтому её сборку тоже
      # проверяем. Ломается она обычно не в вёрстке, а в build/wp-template.js:
      # там подмены ищут точные строки из index.html, и правка разметки
      # тихо оставляет подмену без работы.
      - name: Build WordPress theme
        run: npm run build:theme

      # Собранный архив кладём в артефакты прогона: со страницы проверок его
      # можно скачать, и это единственный способ гарантированно взять свежий
      # файл. Однажды подрядчик загрузил собранный вручную olimp.zip недельной
      # давности, увидел прежние поломки и потерял на этом день.
      #
      # archive: false отдаёт сам файл, а не заворачивает его во второй zip.
      # Без этого скачивался бы архив с архивом внутри, и в админку WordPress
      # ушёл бы не тот файл — она принимает только тему, а не обёртку.
      # Параметр появился в v7, в v4 его не было.
      #
      # if-no-files-found: error намеренно: если сборка перестанет делать
      # архив, прогон должен покраснеть, а не тихо выложить пустоту.
      - name: Upload theme archive
        uses: actions/upload-artifact@v7.0.1
        with:
          path: wp-theme/olimp.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
