name: Проверки

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Файл делает две вещи: проверяет код и выкладывает статику на GitHub Pages.
#
# Pages здесь — не сайт заказчика, а адрес для показа работы. Рабочий сайт
# стоит на своём хостинге, и товары в нём приходят из WordPress; на Pages
# уезжает макет с демо-данными. Поэтому копия закрыта от индексации: без этого
# в поиске появился бы дубль каталога, и две страницы про один диван начали бы
# отбирать позиции друг у друга.
#
# Закрываем метатегом, а не robots.txt: файл читается только из корня домена,
# а проект лежит в подкаталоге degoooooon.github.io/Olimp-mebel — свой
# robots.txt там никто не спросит. Вторая защита уже стоит в разметке:
# canonical ведёт на olimp-mebel26.ru, то есть копия сама указывает на
# первоисточник.

# Публикация требует записи в Pages и токена для проверки источника.
# Больше ничего: содержимое репозитория только читается.
permissions:
  contents: read
  pages: write
  id-token: write

# Новый пуш в ветку отменяет проверку предыдущего — нет смысла ждать
# результат по коду, который уже переписан.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Публикацию в очереди не отменяем: прерванный деплой оставил бы Pages
# в промежуточном состоянии, с половиной обновлённых файлов

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Версия LTS, а не последняя: на ней проект и должен собираться у любого,
      # кто возьмёт репозиторий. Node 20 здесь стоять больше не может —
      # поддержка кончилась в апреле 2026, обновления безопасности не выходят.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build

      # Тема — это то, что реально стоит на хостинге, поэтому её сборку тоже
      # проверяем. Ломается она обычно не в вёрстке, а в build/wp-template.js:
      # там подмены ищут точные строки из index.html, и правка разметки
      # тихо оставляет подмену без работы.
      - name: Build WordPress theme
        run: npm run build:theme

      # Копию закрываем от индексации до упаковки, а не после: после уже нечего
      # править — артефакт собран. У страницы товара noindex стоит в разметке
      # изначально, поэтому здесь только главная.
      #
      # Проверяем, что подстановка попала: sed молча ничего не делает, если
      # строка не нашлась, и копия ушла бы в поиск открытой.
      - name: Close the copy from search engines
        run: |
          sed -i 's|<meta name="viewport"|<meta name="robots" content="noindex, nofollow">\n<meta name="viewport"|' dist/index.html
          grep -q 'name="robots" content="noindex' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload static files
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  # Публикация отдельной работой: у неё свои разрешения и своё окружение,
  # и в списке прогона видно, что упало — проверки или выкладка
  deploy:
    needs: check
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
