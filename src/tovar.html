<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Товар — Мебельный склад «Олимп»</title>
<meta name="description" content="Карточка товара мебельного склада «Олимп»: фотографии, характеристики, цена и наличие.">

<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#B14E2B">

<!--
  Исходник страницы товара. Из этого файла собирается single-olimp_product.php:
  так же, как index.html собирается во front-page.php. Разметка живёт в одном
  месте, а не в двух экземплярах.

  Заголовок и описание здесь заглушки — на живом сайте их печатает WordPress
  из названия товара. В статической сборке подставить неоткуда: товар
  становится известен только после того, как отработает скрипт, поэтому
  макет закрыт от индексации. В теме этот тег снимается при сборке.
-->
<meta name="robots" content="noindex">

<link rel="stylesheet" href="./styles/style.scss">
</head>
<body>

<header class="topbar">
  <a class="topbar__back" href="./">
    <svg class="topbar__arrow" aria-hidden="true"><use href="/__spritemap#i-arrow"/></svg>
    В каталог
  </a>
  <!--
    Корзина здесь только показывает набранное и ведёт в каталог, где панель
    и выезжает. Копии панели на этой странице нет: одна разметка в двух файлах
    расходится, вопрос только в сроке. Адрес с #cart открывает её сразу
    после перехода — иначе человек попал бы в каталог и искал корзину заново.
  -->
  <a class="topbar__cart" href="./#cart">
    <svg class="icon" aria-hidden="true"><use href="/__spritemap#i-bag"/></svg>
    Корзина
    <span class="topbar__count" data-cart-count hidden>0</span>
  </a>
</header>

<main class="tovar" id="tovar">
  <!--
    В статической сборке пусто до отработки скрипта: товар выбирается
    по адресу вида ?tovar=101. В теме это же место заполняет PHP —
    страница читается и поисковиком, и человеком без единой строчки скрипта.
  -->
</main>

<script type="module" src="./js/page-tovar.js"></script>
</body>
</html>
